<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PONGS Connect — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #17232e; color: #f5f6f4; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 18px; margin: 18px 0 6px; }
      p { margin: 0 0 20px; color: #b8c0c7; font-size: 14px; }
      button { background: #b6e65b; color: #17232e; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: 14px; }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>PONGS Connect will reconnect as soon as your phone is back online.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
